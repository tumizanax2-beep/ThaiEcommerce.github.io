<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า - ร้านค้าออนไลน์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                🏪 ร้านค้าออนไลน์
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            🏠 หน้าแรก
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            🛒 ตะกร้าสินค้า
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>🛒 ตะกร้าสินค้า</h4>
                    </div>
                    <div class="card-body">
                        <div id="cart-items">
                            <!-- Cart items will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>สรุปคำสั่งซื้อ</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <span>ยอดรวม:</span>
                            <span class="h5" id="cart-total">฿0</span>
                        </div>
                        <button class="btn btn-success w-100 checkout-btn" onclick="checkout()">
                            ดำเนินการชำระเงิน
                        </button>
                        <a href="index.html" class="btn btn-outline-primary w-100 mt-2">
                            เลือกสินค้าเพิ่ม
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2026 ร้านค้าออนไลน์. สงวนลิขสิทธิ์</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/data.js"></script>
    <script src="static/js/static-script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadCart();
            updateCartCount();
        });

        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const container = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <div class="mb-4">
                            <span style="font-size: 4rem;">🛒</span>
                        </div>
                        <h4>ตะกร้าสินค้าว่าง</h4>
                        <p class="text-muted">ยังไม่มีสินค้าในตะกร้า</p>
                        <a href="index.html" class="btn btn-primary">
                            เลือกสินค้า
                        </a>
                    </div>
                `;
                document.getElementById('cart-total').textContent = '฿0';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="row align-items-center">
                        <div class="col-md-2">
                            <img src="${item.image}" alt="${item.name}" class="img-fluid rounded">
                        </div>
                        <div class="col-md-4">
                            <h6>${item.name}</h6>
                            <p class="text-primary mb-0">฿${item.price.toLocaleString('th-TH')}</p>
                        </div>
                        <div class="col-md-3">
                            <div class="input-group input-group-sm">
                                <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                                <input type="number" class="form-control quantity-input" value="${item.quantity}" min="1" max="99" readonly>
                                <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                            </div>
                        </div>
                        <div class="col-md-2 text-center">
                            <strong class="item-total">฿${(item.price * item.quantity).toLocaleString('th-TH')}</strong>
                        </div>
                        <div class="col-md-1 text-center">
                            <button class="btn btn-sm btn-outline-danger remove-item" onclick="removeFromCart(${item.id})">
                                🗑️
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total').textContent = `฿${total.toLocaleString('th-TH')}`;
        }

        function updateQuantity(productId, newQuantity) {
            if (newQuantity < 1 || newQuantity > 99) return;
            
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity = newQuantity;
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();
                updateCartCount();
            }
        }

        function removeFromCart(productId) {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const updatedCart = cart.filter(item => item.id !== productId);
            localStorage.setItem('cart', JSON.stringify(updatedCart));
            loadCart();
            updateCartCount();
            showToast('ลบสินค้าออกจากตะกร้าแล้ว');
        }

        function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart.length === 0) {
                showToast('ตะกร้าสินค้าว่าง', 'error');
                return;
            }
            
            localStorage.removeItem('cart');
            window.location.href = 'order_success.html';
        }
    </script>
</body>
</html>
